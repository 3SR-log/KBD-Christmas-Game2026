<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎁 サンタのプレゼント仕分け</title>
  <style>
    /* 誤作動（拡大・長押しコピー・ハイライト）を完全にブロックするCSS */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    body {
      font-family: sans-serif;
      /* 白銀の雪国グラデーション背景 */
      background: linear-gradient(180deg, #e0f2fe 0%, #bae6fd 50%, #f0f9ff 100%);
      color: #1e293b;
      text-align: center;
      margin: 0;
      padding: 10px;
      min-height: 100vh;
    }
    h1 { color: #dc2626; font-size: 22px; margin-top: 5px; margin-bottom: 10px; text-shadow: 0 1px 2px #fff; }
    .card {
      /* 白く透明感のあるスノーカード */
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 15px;
      max-width: 400px;
      margin: 0 auto;
      box-shadow: 0 8px 20px rgba(186, 230, 253, 0.6), 0 2px 6px rgba(0,0,0,0.05);
      border: 2px solid #ffffff;
    }
    input[type="text"], select {
      width: 85%;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      margin-bottom: 10px;
      text-align: center;
      background: #f8fafc;
      color: #1e293b;
    }
    button.btn-main {
      background: #16a34a;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(22, 163, 74, 0.3);
    }
    #play-area {
      position: relative;
      width: 100%;
      height: 200px;
      /* 氷の世界のような透明感ある濃紺グラデーション（プレゼントが映える） */
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      border-radius: 12px;
      margin: 5px 0 10px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid #e2e8f0;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.3);
    }
    
    /* プレゼント画像のスタイル */
    #target-present-icon {
      width: 95px;
      height: 95px;
      margin-bottom: 2px;
    }

    #target-label {
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* リアルタイム判定表示 */
    .feedback {
      height: 24px;
      font-size: 18px;
      font-weight: bold;
      color: #0284c7;
      margin-bottom: 5px;
    }

    /* 指が太くても乾燥していても押しやすい巨大3大ボタン */
    .button-group {
      display: flex;
      gap: 8px;
      justify-content: space-between;
      width: 100%;
      margin-top: 5px;
    }
    .color-btn {
      flex: 1;
      height: 90px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    }
    .color-btn:active {
      transform: translateY(3px);
      box-shadow: none;
    }
    .btn-red { background: #ef4444; }
    .btn-green { background: #16a34a; }
    .btn-blue { background: #2563eb; }

    .hidden { display: none !important; }
    .score-display { font-size: 44px; color: #d97706; font-weight: bold; margin: 5px 0; }
    .title-badge { 
      font-size: 18px; 
      color: #0284c7; 
      background: #e0f2fe; 
      padding: 6px 14px; 
      border-radius: 20px; 
      display: inline-block;
      margin-bottom: 10px;
      font-weight: bold;
      border: 1px solid #bae6fd;
    }
    .info-text { font-size: 14px; color: #475569; }
    .timer-text { font-size: 22px; color: #dc2626; font-weight: bold; }

    /* くまさん発見案内バッジ */
    .bear-badge {
      background: #fef3c7;
      color: #b45309;
      border: 2px dashed #f59e0b;
      padding: 8px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
      margin: 8px 0;
      display: inline-block;
    }

    /* 虹色グラアニメーション */
    @keyframes rainbow {
      0% { stop-color: #ff0000; }
      20% { stop-color: #ffff00; }
      40% { stop-color: #00ff00; }
      60% { stop-color: #00ffff; }
      80% { stop-color: #ff00ff; }
      100% { stop-color: #ff0000; }
    }
  </style>
</head>
<body>

<div class="card">
  <h1>🎁 サンタのプレゼント仕分け 🎅</h1>

  <!-- 1. スタート画面 -->
  <div id="start-screen">
    <p class="info-text">出てくるプレゼントと同じ色のボタンを素早く押して</p>
    <p class="info-text">仕分けよう！（制限時間15秒）</p>
    
    <p class="info-text" style="font-size: 12px; margin-bottom: 5px;">お名前を選んでね</p>

    <select id="name-select" onchange="toggleCustomInput()">
      <option value="">-- 名前を選択してください --</option>
      <option value="KK">KK</option>
      <option value="JJ">JJ</option>
      <option value="トミー">トミー</option>
      <option value="ジュリー">ジュリー</option>
      <option value="ロッキー">ロッキー</option>
      <option value="シュート">シュート</option>
      <option value="ダッツ">ダッツ</option>
      <option value="アッキー">アッキー</option>
      <option value="美名先生">美名先生</option>
      <option value="チサちゃん">チサちゃん</option>
      <option value="ナオちゃん">ナオちゃん</option>
      <option value="ミソラ">ミソラ</option>
      <option value="OTHER">✨ その他（直接入力）</option>
    </select>

    <div id="custom-name-container" class="hidden">
      <input type="text" id="custom-username" placeholder="名前を直接入力" style="margin-bottom: 10px;" />
    </div>

    <br>
    <button class="btn-main" onclick="startGame()">ゲームスタート！</button>
  </div>

  <!-- 2. プレイ画面 -->
  <div id="game-screen" class="hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 5px;">
      <div class="timer-text">残り: <span id="timer">15</span> 秒</div>
      <div class="info-text" style="font-size: 16px; color: #1e293b;">スコア: <strong id="current-score" style="color:#d97706; font-size: 20px;">0</strong> 点</div>
    </div>

    <div class="feedback" id="feedback"></div>

    <div id="play-area">
      <!-- 色ごとに動的に差し替わるSVGプレゼント画像 -->
      <div id="target-present-icon"></div>
      <div id="target-label">あか</div>
    </div>

    <!-- 乾燥指・指太対策：巨大3色ボタン -->
    <div class="button-group">
      <button class="color-btn btn-red" onclick="checkAnswer('red')">
        <span style="font-size: 24px;">🔴</span>
        <span>あか</span>
      </button>
      <button class="color-btn btn-green" onclick="checkAnswer('green')">
        <span style="font-size: 24px;">🟢</span>
        <span>みどり</span>
      </button>
      <button class="color-btn btn-blue" onclick="checkAnswer('blue')">
        <span style="font-size: 24px;">🔵</span>
        <span>あお</span>
      </button>
    </div>
  </div>

  <!-- 3. 結果画面 -->
  <div id="result-screen" class="hidden">
    <h2>🎉 おつかれさまでした！</h2>
    <p><strong id="res-name"></strong> さんの獲得称号</p>
    <div class="title-badge" id="player-title">🏆 時空を越える光のサンタ</div>
    
    <div class="score-display" id="final-score">0 点</div>

    <!-- くまさん遭遇メッセージ -->
    <div id="bear-found-msg" class="bear-badge hidden">
      🧸 超激レア「くまさん」が出現しました！<br>スクショしてみんなに見せてね！📸
    </div>

    <!-- 自動送信ボタン -->
    <button id="send-btn" class="btn-main" onclick="sendScore()" style="background: #f59e0b; margin-bottom: 12px; width: 100%;">
      🚀 スコアを送信する！
    </button>
    <div id="send-status" style="font-size: 14px; color: #0284c7; margin-bottom: 15px;"></div>

    <button id="reset-btn" onclick="resetGame()" style="background: #64748b; color: #fff; border:none; padding:10px 20px; border-radius:20px; font-size: 14px;">もう一度あそぶ</button>
  </div>
</div>

<script>
  // ★新しいクリスマス用GASのウェブアプリURLを貼り付けます
  const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzlfEKzsBXn7137ZFocRy0KHACgFTYV73gCxGiojAbNBdoWQoqtkK7UxjcQPyVB6e7hwQ/exec";

  let playerName = "";
  let score = 0;
  let timeLeft = 15;
  let timerId = null;
  let currentTargetColor = "";
  let questionStartTime = 0;
  let foundBear = false; // くまさん遭遇フラグ

  // 各色のSVG画像データ（通常色＋レインボー＋くまさん）
  const colors = [
    { 
      id: 'red', 
      name: 'あか', 
      colorCode: '#ef4444',
      svg: `<svg viewBox="0 0 100 100" width="100%" height="100%">
              <rect x="15" y="35" width="70" height="50" fill="#ef4444" rx="5"/>
              <rect x="10" y="25" width="80" height="15" fill="#dc2626" rx="3"/>
              <rect x="42" y="25" width="16" height="60" fill="#facc15"/>
              <rect x="15" y="52" width="70" height="16" fill="#facc15"/>
              <path d="M 35 25 C 20 10, 45 5, 45 25 Z" fill="#facc15"/>
              <path d="M 65 25 C 80 10, 55 5, 55 25 Z" fill="#facc15"/>
            </svg>`
    },
    { 
      id: 'green', 
      name: 'みどり', 
      colorCode: '#22c55e',
      svg: `<svg viewBox="0 0 100 100" width="100%" height="100%">
              <rect x="15" y="35" width="70" height="50" fill="#22c55e" rx="5"/>
              <rect x="10" y="25" width="80" height="15" fill="#16a34a" rx="3"/>
              <rect x="42" y="25" width="16" height="60" fill="#ef4444"/>
              <rect x="15" y="52" width="70" height="16" fill="#ef4444"/>
              <path d="M 35 25 C 20 10, 45 5, 45 25 Z" fill="#ef4444"/>
              <path d="M 65 25 C 80 10, 55 5, 55 25 Z" fill="#ef4444"/>
            </svg>`
    },
    { 
      id: 'blue', 
      name: 'あお', 
      colorCode: '#3b82f6',
      svg: `<svg viewBox="0 0 100 100" width="100%" height="100%">
              <rect x="15" y="35" width="70" height="50" fill="#3b82f6" rx="5"/>
              <rect x="10" y="25" width="80" height="15" fill="#2563eb" rx="3"/>
              <rect x="42" y="25" width="16" height="60" fill="#ffffff"/>
              <rect x="15" y="52" width="70" height="16" fill="#ffffff"/>
              <path d="M 35 25 C 20 10, 45 5, 45 25 Z" fill="#ffffff"/>
              <path d="M 65 25 C 80 10, 55 5, 55 25 Z" fill="#ffffff"/>
            </svg>`
    }
  ];

  // 虹色プレミアムBOX用データ
  const rainbowColor = {
    id: 'rainbow',
    name: '🌟 プレミアム 🌟',
    colorCode: '#facc15',
    svg: `<svg viewBox="0 0 100 100" width="100%" height="100%">
            <defs>
              <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff4d4d"/>
                <stop offset="33%" stop-color="#facc15"/>
                <stop offset="66%" stop-color="#22c55e"/>
                <stop offset="100%" stop-color="#3b82f6"/>
              </linearGradient>
            </defs>
            <rect x="15" y="35" width="70" height="50" fill="url(#rainbowGrad)" rx="5"/>
            <rect x="10" y="25" width="80" height="15" fill="url(#rainbowGrad)" rx="3"/>
            <rect x="42" y="25" width="16" height="60" fill="#ffffff"/>
            <rect x="15" y="52" width="70" height="16" fill="#ffffff"/>
            <path d="M 35 25 C 20 10, 45 5, 45 25 Z" fill="#ffffff"/>
            <path d="M 65 25 C 80 10, 55 5, 55 25 Z" fill="#ffffff"/>
          </svg>`
  };

  // 超激レアサンタくまさん（画像のイラストをそのまま再現）
  const bearColor = {
    id: 'bear',
    name: '🧸 奇跡のサンタくま 🧸',
    colorCode: '#d97706',
    svg: `<svg viewBox="0 0 100 100" width="100%" height="100%">
            <!-- 耳 -->
            <circle cx="30" cy="32" r="11" fill="#8c512d" stroke="#3d1e0b" stroke-width="2.5"/>
            <circle cx="30" cy="32" r="6" fill="#d99b6c"/>
            <circle cx="70" cy="32" r="11" fill="#8c512d" stroke="#3d1e0b" stroke-width="2.5"/>
            <!-- サンタ帽子（後ろ側・ポンポン） -->
            <circle cx="72" cy="22" r="6" fill="#ffffff" stroke="#3d1e0b" stroke-width="2"/>
            <!-- 体（サンタ服） -->
            <path d="M 28 55 Q 18 85 30 88 Q 50 92 70 88 Q 82 85 72 55 Z" fill="#c0392b" stroke="#3d1e0b" stroke-width="2.5"/>
            <!-- 裾のもこもこフチ -->
            <path d="M 26 82 Q 50 92 74 82 Q 76 87 70 88 Q 50 92 30 88 Z" fill="#ffffff" stroke="#3d1e0b" stroke-width="2"/>
            <!-- 足 -->
            <ellipse cx="36" cy="86" rx="9" ry="6" fill="#8c512d" stroke="#3d1e0b" stroke-width="2.5"/>
            <ellipse cx="64" cy="86" rx="9" ry="6" fill="#8c512d" stroke="#3d1e0b" stroke-width="2.5"/>
            <!-- 襟のもこもこ -->
            <path d="M 28 58 Q 50 66 72 58 Q 74 64 50 68 Q 26 64 28 58 Z" fill="#ffffff" stroke="#3d1e0b" stroke-width="2"/>
            <!-- 頭（顔） -->
            <ellipse cx="50" cy="48" rx="23" ry="20" fill="#8c512d" stroke="#3d1e0b" stroke-width="2.5"/>
            <!-- 口元（鼻まわり） -->
            <ellipse cx="50" cy="53" rx="8" ry="6" fill="#d99b6c"/>
            <ellipse cx="50" cy="50" rx="3" ry="2.5" fill="#3d1e0b"/>
            <path d="M 50 52.5 L 50 55.5" stroke="#3d1e0b" stroke-width="2"/>
            <!-- つぶらな目 -->
            <circle cx="41" cy="47" r="2.5" fill="#3d1e0b"/>
            <circle cx="59" cy="47" r="2.5" fill="#3d1e0b"/>
            <!-- サンタ帽子（赤い部分＋フチ） -->
            <path d="M 31 38 Q 50 20 68 35 Q 60 28 40 32 Z" fill="#c0392b" stroke="#3d1e0b" stroke-width="2"/>
            <path d="M 30 38 Q 50 32 70 37 Q 68 42 50 38 Q 32 42 30 38 Z" fill="#ffffff" stroke="#3d1e0b" stroke-width="2"/>
            <!-- 抱えている緑のプレゼントBOX -->
            <rect x="42" y="62" width="16" height="14" fill="#27ae60" stroke="#3d1e0b" stroke-width="2" rx="2"/>
            <rect x="48" y="62" width="4" height="14" fill="#c0392b"/>
            <rect x="42" y="67" width="16" height="4" fill="#c0392b"/>
            <!-- リボン結び目 -->
            <circle cx="50" cy="61" r="2" fill="#e74c3c"/>
            <!-- 手（袖のもこもこ＋茶色の手） -->
            <circle cx="34" cy="66" r="4.5" fill="#ffffff" stroke="#3d1e0b" stroke-width="2"/>
            <circle cx="38" cy="66" r="3.5" fill="#8c512d" stroke="#3d1e0b" stroke-width="2"/>
            <circle cx="66" cy="66" r="4.5" fill="#ffffff" stroke="#3d1e0b" stroke-width="2"/>
            <circle cx="62" cy="66" r="3.5" fill="#8c512d" stroke="#3d1e0b" stroke-width="2"/>
          </svg>`
  };

  function toggleCustomInput() {
    const select = document.getElementById('name-select');
    const container = document.getElementById('custom-name-container');
    if (select.value === 'OTHER') {
      container.classList.remove('hidden');
    } else {
      container.classList.add('hidden');
    }
  }

  function startGame() {
    const selectValue = document.getElementById('name-select').value;
    let nameInput = "";

    if (selectValue === 'OTHER') {
      nameInput = document.getElementById('custom-username').value.trim();
    } else {
      nameInput = selectValue;
    }

    if (!nameInput) {
      alert("名前を選択するか、入力してください！※自分の名前で遊んでね！");
      return;
    }

    playerName = nameInput;
    score = 0;
    timeLeft = 15;
    foundBear = false;

    document.getElementById('current-score').innerText = score;
    document.getElementById('timer').innerText = timeLeft;
    document.getElementById('feedback').innerText = "";

    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');

    nextQuestion();

    // カウントダウンタイマー開始
    timerId = setInterval(() => {
      timeLeft--;
      document.getElementById('timer').innerText = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(timerId);
        endGame();
      }
    }, 1000);
  }

  function nextQuestion() {
    // ★ テスト用：常にくまさんを選択（100%）
    let selectedObj = bearColor;
    foundBear = true;

    currentTargetColor = selectedObj.id;

    // プレゼントアイコン（SVG）の更新
    document.getElementById('target-present-icon').innerHTML = selectedObj.svg;

    // 下の文字ラベルの更新
    const label = document.getElementById('target-label');
    label.innerText = selectedObj.name;
    label.style.color = selectedObj.colorCode;

    questionStartTime = Date.now();
  }

  function checkAnswer(selectedColor) {
    const reactionTime = Date.now() - questionStartTime;
    const fb = document.getElementById('feedback');

    // 1. くまさんの場合はどれを押しても+100点＆次の色へ
    if (currentTargetColor === 'bear') {
      score += 100;
      fb.innerText = "🧸 奇跡発生! +100点! 🧸";
      fb.style.color = "#d97706";
      document.getElementById('current-score').innerText = score;
      nextQuestion();
    }
    // 2. 虹色の場合はどれを押しても+30点＆次の色へ
    else if (currentTargetColor === 'rainbow') {
      score += 30;
      fb.innerText = "🌟 BONUS +30! 🌟";
      fb.style.color = "#d97706";
      document.getElementById('current-score').innerText = score;
      nextQuestion();
    }
    // 3. 通常色で正解した場合（次の色へ進む）
    else if (selectedColor === currentTargetColor) {
      score += 10;

      // 階級スピード判定
      if (reactionTime < 350) {
        fb.innerText = "⚡ 超神速サンタ!!";
        fb.style.color = "#dc2626";
      } else if (reactionTime < 600) {
        fb.innerText = "🎅 ベテランサンタ!";
        fb.style.color = "#0284c7";
      } else {
        fb.innerText = "🛷 見習いサンタ";
        fb.style.color = "#16a34a";
      }

      document.getElementById('current-score').innerText = score;
      nextQuestion(); // 正解した時だけ次の問題へ！
    } 
    // 4. お手付き（間違えた場合）：正解するまで同じ色に留まる！
    else {
      score = Math.max(0, score - 5);
      fb.innerText = "❄️ つまずいた! 同じ色を押してね! (-5)";
      fb.style.color = "#dc2626";
      document.getElementById('current-score').innerText = score;
      // nextQuestion() は呼ばずにそのまま留まる
    }
  }

  function endGame() {
    document.getElementById('game-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');

    document.getElementById('res-name').innerText = playerName;
    document.getElementById('final-score').innerText = score + " 点";

    // くまさん出現案内の表示切り替え
    const bearMsg = document.getElementById('bear-found-msg');
    if (foundBear) {
      bearMsg.classList.remove('hidden');
    } else {
      bearMsg.classList.add('hidden');
    }

    // 獲得称号の決定
    const titleBox = document.getElementById('player-title');
    if (score >= 150) {
      titleBox.innerText = "🏆 時空を越える光のサンタ";
    } else if (score >= 100) {
      titleBox.innerText = "🎁 プレゼント仕分けマスター";
    } else if (score >= 60) {
      titleBox.innerText = "🛷 がんばり屋のトナカイ";
    } else {
      titleBox.innerText = "☃️ うっかり雪だるま";
    }

    const btn = document.getElementById('send-btn');
    btn.style.display = "block";
    btn.disabled = false;
    document.getElementById('send-status').innerText = "";

    // 誤連打でスタート画面に戻るのを防ぐため、リセットボタンを一時無効化（2.5秒間）
    const resetBtn = document.getElementById('reset-btn');
    resetBtn.disabled = true;
    resetBtn.style.opacity = "0.5";
    setTimeout(() => {
      resetBtn.disabled = false;
      resetBtn.style.opacity = "1";
    }, 2500);
  }

  function sendScore() {
    const btn = document.getElementById('send-btn');
    const status = document.getElementById('send-status');

    if (GAS_WEBAPP_URL === "YOUR_NEW_CHRISTMAS_GAS_URL_HERE") {
      alert("管理者用：新しいGASのWebアプリURLがセットされていません。");
      return;
    }

    btn.disabled = true;
    status.innerText = "送信中...";

    fetch(GAS_WEBAPP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: playerName,
        score: score
      })
    })
    .then(() => {
      status.innerText = "✅ スコアを送信しました！";
      btn.style.display = "none";
    })
    .catch(() => {
      status.innerText = "❌ 送信に失敗しました。もう一度お試しください。";
      btn.disabled = false;
    });
  }

  function resetGame() {
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('start-screen').classList.remove('hidden');
  }
</script>
</body>
</html>
